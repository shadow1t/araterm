name: Windows installer

# يبني ملف تثبيت araterm (Setup.exe) على خوادم GitHub — لا حاجة لأدوات
# بناء على جهاز المستخدم: شغّل المهمة من تبويب Actions ثم نزّل الناتج.
# عند وسم إصدار (v*) يُنشر المثبت تلقائيًا في صفحة Releases.

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        # npm install (وليس npm ci) — المستودع بلا package-lock.json بعد؛
        # عندما يُرفع ملف القفل مستقبلًا يمكن العودة إلى npm ci الأسرع والأثبت
        run: npm install --no-audit --no-fund

      - name: Run unit tests
        run: npm test

      - name: Build installer
        run: npx electron-builder --win nsis --publish never

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: araterm-windows-installer
          path: dist/*.exe
          if-no-files-found: error

      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
