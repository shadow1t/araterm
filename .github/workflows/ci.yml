name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      # اختبارات الراسمة تحتاج arafix فقط — لا حاجة لتنزيل Electron كاملًا
      - name: Install arafix engine
        run: npm install --no-save github:shadow1t/arafix
      - name: Run tests
        run: node --test tests/*.test.mjs
